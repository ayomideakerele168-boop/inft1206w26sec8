<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        function validate(){
            let fname=document.querySelector('#fname').value.trim();
            if(fname.length==0){
                document.querySelector('#fname-error').textContent = "you mjust provide valur=e for the first name "
                return false
            }
            else if(fname.length<5){
                document.querySelector('#fname-error').textContent = "firstname must be atleast 5 chracters";
                document.querySelector('#fname-error').style.color=''
            }
             return true;
        }
    </script>
    <title>WEEEK 12</title>

</head>
<body>
    <h1>Form Validation</h1>
    <form action="https://httpbin.org/get" method="get" onsubmit="return validate()">
        <div>
            <label for="">first name:</label>
            <input type="text" id="fname" name ="fname">

        </div>
        <div>
            <label for="">last name:</label>
            <input type="text" id="lname" name="lname">
        
        </div>
        <div>
            <label for="">Age</label>
            <input type="number" id="age" name="age">
        
        </div>
        <div>
            <input type="submit">
            <input type="reset">
        </div>
    </form>
</body>
</html>
